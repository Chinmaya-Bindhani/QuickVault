[package]
name = "quickvault"
version = "0.3.0"
edition = "2024"
description = "Local, event-driven Windows snippet manager"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Security",
    "Win32_UI_HiDpi", "Win32_UI_Controls_Dialogs", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
